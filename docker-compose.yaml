services:
  db:
    container_name: erp-postgres
    image: postgres:15.2
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - 5432:5432
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    networks:
      - erp-backend

volumes:
  erp_postgres_data:

networks:
  erp-backend:
